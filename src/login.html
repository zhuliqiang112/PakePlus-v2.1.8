<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工绩效分数管理系统 - 登录</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        success: '#16a34a',
                        danger: '#dc2626',
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .btn-primary { @apply bg-primary text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-800 transition-colors; }
            .input-field { @apply w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent; }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-xl shadow-lg p-8">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-primary mb-2">员工绩效分数管理系统</h1>
                <p class="text-gray-600">请登录后使用系统</p>
            </div>

            <!-- 登录表单 -->
            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="username" class="block text-gray-700 text-sm font-bold mb-2">
                        <i class="fa fa-user mr-2"></i>账号
                    </label>
                    <input type="text" id="username" class="input-field" placeholder="请输入登录账号">
                </div>
                <div>
                    <label for="password" class="block text-gray-700 text-sm font-bold mb-2">
                        <i class="fa fa-lock mr-2"></i>密码
                    </label>
                    <input type="password" id="password" class="input-field" placeholder="请输入登录密码">
                </div>
                
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="rememberMe" type="checkbox" class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
                        <label for="rememberMe" class="ml-2 block text-sm text-gray-700">记住我</label>
                    </div>
                    <button type="button" id="manageUserBtn" class="text-sm text-primary hover:text-blue-800">
                        <i class="fa fa-cog mr-1"></i>用户管理
                    </button>
                </div>
                
                <button type="submit" class="w-full btn-primary text-lg py-3">
                    <i class="fa fa-sign-in mr-2"></i>登录系统
                </button>
            </form>

            <!-- 错误提示 -->
            <div id="errorMsg" class="mt-4 text-center text-danger hidden">
                <i class="fa fa-exclamation-circle mr-1"></i>
                <span id="errorText">账号或密码错误</span>
            </div>
        </div>

        <!-- 用户管理模态框 -->
        <div id="userModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
            <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-primary">用户管理</h2>
                    <button id="closeModalBtn" class="text-gray-500 hover:text-gray-700">
                        <i class="fa fa-times text-xl"></i>
                    </button>
                </div>

                <!-- 添加用户表单 -->
                <form id="addUserForm" class="space-y-4 mb-6">
                    <div>
                        <label for="newUsername" class="block text-gray-700 text-sm font-bold mb-2">新账号</label>
                        <input type="text" id="newUsername" class="input-field" placeholder="请输入新账号">
                    </div>
                    <div>
                        <label for="newPassword" class="block text-gray-700 text-sm font-bold mb-2">新密码</label>
                        <input type="password" id="newPassword" class="input-field" placeholder="请输入新密码">
                    </div>
                    <button type="submit" class="w-full btn-primary">
                        <i class="fa fa-plus mr-2"></i>添加用户
                    </button>
                </form>

                <!-- 用户列表 -->
                <div>
                    <h3 class="text-lg font-semibold text-gray-700 mb-3">现有用户</h3>
                    <div id="userList" class="space-y-2 max-h-40 overflow-y-auto">
                        <div class="text-gray-500 text-center py-4">暂无用户</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 初始化用户数据（默认管理员账号：admin/admin123）
        let users = JSON.parse(localStorage.getItem('systemUsers') || '[]');
        if (users.length === 0) {
            users.push({ username: 'admin', password: 'admin123' });
            localStorage.setItem('systemUsers', JSON.stringify(users));
        }

        // DOM元素
        const el = {
            loginForm: document.getElementById('loginForm'),
            username: document.getElementById('username'),
            password: document.getElementById('password'),
            rememberMe: document.getElementById('rememberMe'),
            errorMsg: document.getElementById('errorMsg'),
            errorText: document.getElementById('errorText'),
            manageUserBtn: document.getElementById('manageUserBtn'),
            userModal: document.getElementById('userModal'),
            closeModalBtn: document.getElementById('closeModalBtn'),
            addUserForm: document.getElementById('addUserForm'),
            newUsername: document.getElementById('newUsername'),
            newPassword: document.getElementById('newPassword'),
            userList: document.getElementById('userList')
        };

        // 初始化
        function init() {
            // 检查是否有记住的账号
            const savedUser = localStorage.getItem('rememberedUser');
            if (savedUser) {
                el.username.value = savedUser;
                el.rememberMe.checked = true;
            }

            // 绑定事件
            bindEvents();
            
            // 渲染用户列表
            renderUserList();
        }

        // 绑定事件
        function bindEvents() {
            // 登录表单提交
            el.loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                login();
            });

            // 用户管理按钮
            el.manageUserBtn.addEventListener('click', function() {
                el.userModal.classList.remove('hidden');
            });

            // 关闭模态框
            el.closeModalBtn.addEventListener('click', function() {
                el.userModal.classList.add('hidden');
            });

            // 添加用户表单提交
            el.addUserForm.addEventListener('submit', function(e) {
                e.preventDefault();
                addUser();
            });

            // 点击模态框外部关闭
            el.userModal.addEventListener('click', function(e) {
                if (e.target === el.userModal) {
                    el.userModal.classList.add('hidden');
                }
            });
        }

        // 登录验证
        function login() {
            const username = el.username.value.trim();
            const password = el.password.value.trim();

            // 验证输入
            if (!username) {
                showError('请输入账号');
                el.username.focus();
                return;
            }
            if (!password) {
                showError('请输入密码');
                el.password.focus();
                return;
            }

            // 验证账号密码
            const user = users.find(u => u.username === username && u.password === password);
            if (user) {
                // 登录成功
                localStorage.setItem('loggedInUser', username);
                
                // 记住账号
                if (el.rememberMe.checked) {
                    localStorage.setItem('rememberedUser', username);
                } else {
                    localStorage.removeItem('rememberedUser');
                }

                // 跳转到系统主页面
                window.location.href = 'index.html';
            } else {
                showError('账号或密码错误');
                el.password.value = '';
                el.password.focus();
            }
        }

        // 添加用户
        function addUser() {
            const username = el.newUsername.value.trim();
            const password = el.newPassword.value.trim();

            // 验证输入
            if (!username) {
                alert('请输入新账号');
                el.newUsername.focus();
                return;
            }
            if (!password) {
                alert('请输入新密码');
                el.newPassword.focus();
                return;
            }

            // 检查账号是否已存在
            if (users.some(u => u.username === username)) {
                alert('该账号已存在');
                el.newUsername.select();
                return;
            }

            // 添加新用户
            users.push({ username, password });
            localStorage.setItem('systemUsers', JSON.stringify(users));
            
            // 重置表单并刷新列表
            el.newUsername.value = '';
            el.newPassword.value = '';
            renderUserList();
            
            alert('用户添加成功');
        }

        // 删除用户
        function deleteUser(username) {
            if (username === 'admin') {
                alert('管理员账号不能删除');
                return;
            }
            
            if (confirm(`确定删除账号「${username}」吗？`)) {
                users = users.filter(u => u.username !== username);
                localStorage.setItem('systemUsers', JSON.stringify(users));
                renderUserList();
            }
        }

        // 渲染用户列表
        function renderUserList() {
            if (users.length === 0) {
                el.userList.innerHTML = '<div class="text-gray-500 text-center py-4">暂无用户</div>';
                return;
            }

            el.userList.innerHTML = users.map(user => `
                <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                    <div class="flex items-center">
                        <i class="fa fa-user-circle text-primary mr-2"></i>
                        <span class="${user.username === 'admin' ? 'font-bold text-primary' : 'font-medium'}">
                            ${user.username} ${user.username === 'admin' ? '(管理员)' : ''}
                        </span>
                    </div>
                    <button onclick="deleteUser('${user.username}')" 
                            class="text-red-500 hover:text-red-700 ${user.username === 'admin' ? 'opacity-50 cursor-not-allowed' : ''}"
                            ${user.username === 'admin' ? 'disabled' : ''}>
                        <i class="fa fa-trash"></i>
                    </button>
                </div>
            `).join('');
        }

        // 显示错误信息
        function showError(message) {
            el.errorText.textContent = message;
            el.errorMsg.classList.remove('hidden');
            
            // 3秒后隐藏
            setTimeout(() => {
                el.errorMsg.classList.add('hidden');
            }, 3000);
        }

        // 全局暴露删除用户函数
        window.deleteUser = deleteUser;

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
