<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能合同处理平台</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- SheetJS for Excel processing -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0066ff',
                        secondary: '#00ccff',
                        accent: '#00ff9d',
                        dark: '#0a192f',
                        'dark-light': '#112240',
                        'dark-lighter': '#1d2d50',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .glass {
                background: rgba(255, 255, 255, 0.1);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.2);
            }
            .glass-dark {
                background: rgba(10, 25, 47, 0.7);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
            .text-gradient {
                background: linear-gradient(90deg, #00ccff, #0066ff);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
            .border-glow {
                box-shadow: 0 0 20px rgba(0, 102, 255, 0.3);
            }
            .bg-grid {
                background-image: 
                    linear-gradient(rgba(0, 204, 255, 0.1) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(0, 204, 255, 0.1) 1px, transparent 1px);
                background-size: 30px 30px;
            }
            .scrollbar-thin {
                scrollbar-width: thin;
            }
            .scrollbar-thin::-webkit-scrollbar {
                width: 6px;
            }
            .scrollbar-thin::-webkit-scrollbar-track {
                background: rgba(255, 255, 255, 0.1);
                border-radius: 3px;
            }
            .scrollbar-thin::-webkit-scrollbar-thumb {
                background: rgba(0, 102, 255, 0.5);
                border-radius: 3px;
            }
            .scrollbar-thin::-webkit-scrollbar-thumb:hover {
                background: rgba(0, 102, 255, 0.7);
            }
        }
    </style>
    
    <style>
        body {
            background: linear-gradient(135deg, #0a192f 0%, #112240 50%, #020c1b 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .bg-blur {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.3;
        }
        
        .bg-blur-1 {
            top: -100px;
            right: -100px;
            background: rgba(0, 102, 255, 0.6);
            animation: float 8s ease-in-out infinite;
        }
        
        .bg-blur-2 {
            bottom: -100px;
            left: -100px;
            background: rgba(0, 204, 255, 0.4);
            animation: float 10s ease-in-out infinite reverse;
        }
        
        .progress-bar {
            background: linear-gradient(90deg, #0066ff, #00ccff);
            transition: width 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }
        
        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        
        .btn-primary {
            background: linear-gradient(90deg, #0066ff, #00ccff);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
            z-index: -1;
        }
        
        .btn-primary:hover::before {
            left: 100%;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 102, 255, 0.4);
        }
        
        .card {
            transition: all 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .file-drop-area {
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .file-drop-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }
        
        .file-drop-area:hover::before,
        .file-drop-area.dragover::before {
            left: 100%;
        }
        
        .file-drop-area:hover, 
        .file-drop-area.dragover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 102, 255, 0.2);
            border-color: rgba(0, 102, 255, 0.5);
        }
        
        .log-entry {
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .loading-spinner {
            border: 3px solid rgba(0, 102, 255, 0.1);
            border-top: 3px solid #0066ff;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .floating-icon {
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .checkbox-custom {
            transition: all 0.3s ease;
        }
        
        .checkbox-custom input:checked + .checkbox-icon {
            background: linear-gradient(90deg, #0066ff, #00ccff);
            border-color: #0066ff;
        }
        
        .checkbox-custom input:checked + .checkbox-icon i {
            opacity: 1;
            transform: scale(1);
        }
        
        .checkbox-icon i {
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s ease;
        }
        
        /* Animate elements on page load */
        .animate-on-load {
            opacity: 0;
            transform: translateY(20px);
        }
        
        /* Footer styles */
        .footer {
            background: rgba(10, 25, 47, 0.8);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .footer-text {
            background: linear-gradient(90deg, #00ccff, #00ff9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body>
    <!-- Background Effects -->
    <div class="bg-blur bg-blur-1"></div>
    <div class="bg-blur bg-blur-2"></div>
    <div class="bg-grid fixed inset-0 opacity-30"></div>

    <div class="container mx-auto px-4 py-16 relative z-10">
        <!-- Header -->
        <header class="text-center mb-16 animate-on-load" style="animation-delay: 0.1s; animation-fill-mode: forwards;">
            <div class="flex justify-center items-center mb-6">
                <div class="w-20 h-20 rounded-full glass flex items-center justify-center border-glow animate-float">
                    <i class="fa fa-table text-3xl text-white"></i>
                </div>
            </div>
            <h1 class="text-5xl md:text-6xl font-bold text-white mb-4">智能合同处理平台</h1>
            <p class="text-xl text-gray-300 max-w-3xl mx-auto">
                <span class="text-gradient">AI驱动</span>的电子表格智能处理工具，一键完成数据转换、合并和复杂计算
            </p>
        </header>

        <div class="max-w-5xl mx-auto">
            <!-- File Upload Section -->
            <div class="glass-dark rounded-2xl p-10 mb-8 border-glow animate-on-load card" style="animation-delay: 0.2s; animation-fill-mode: forwards;">
                <div id="dropZone" class="file-drop-area border-2 border-dashed border-blue-400/30 rounded-xl p-12 text-center cursor-pointer hover:border-blue-400 transition-all">
                    <div class="floating-icon mb-8">
                        <i class="fa fa-cloud-upload text-6xl text-blue-400"></i>
                    </div>
                    <h3 class="text-2xl md:text-3xl font-bold text-white mb-4">拖放Excel文件到此处</h3>
                    <p class="text-blue-300 mb-8 text-lg">或点击选择文件开始智能处理</p>
                    <input type="file" id="fileInput" accept=".xlsx,.xls" class="hidden">
                    <button id="browseBtn" class="btn-primary text-white px-10 py-4 rounded-xl font-semibold text-lg">
                        <i class="fa fa-folder-open mr-3"></i>选择文件
                    </button>
                    <div class="mt-8 flex items-center justify-center text-blue-300">
                        <i class="fa fa-info-circle mr-2"></i>
                        <span>支持 .xlsx, .xls 格式，最大 10MB</span>
                    </div>
                </div>
            </div>

            <!-- Processing Options -->
            <div id="optionsSection" class="glass-dark rounded-2xl p-10 mb-8 hidden border-glow animate-on-load card" style="animation-delay: 0.3s; animation-fill-mode: forwards;">
                <div class="flex items-center justify-between mb-8">
                    <h3 class="text-2xl font-bold text-white">处理选项</h3>
                    <div class="w-12 h-12 rounded-full glass flex items-center justify-center">
                        <i class="fa fa-sliders text-blue-400 text-xl"></i>
                    </div>
                </div>
                
                <div class="space-y-6">
                    <!-- Worksheet Selection -->
                    <div class="p-5 glass rounded-lg">
                        <label class="block text-white font-semibold text-lg mb-3">
                            <i class="fa fa-file-text-o mr-2 text-blue-400"></i>选择工作表
                        </label>
                        <div class="relative">
                            <select id="worksheetSelect" class="w-full bg-dark-lighter border border-blue-400/30 rounded-lg p-3 text-white appearance-none focus:outline-none focus:border-blue-400">
                                <option value="all">处理所有工作表</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none">
                                <i class="fa fa-chevron-down text-blue-400"></i>
                            </div>
                        </div>
                        <p class="text-blue-300 text-sm mt-2">选择要处理的工作表，默认处理所有工作表</p>
                    </div>
                    
                    <label class="checkbox-custom flex items-center p-5 glass rounded-lg hover:bg-white/5 transition-all cursor-pointer">
                        <div class="relative mr-6">
                            <input type="checkbox" id="mergeItems" class="sr-only" checked>
                            <div class="checkbox-icon w-6 h-6 rounded border-2 border-blue-400 flex items-center justify-center">
                                <i class="fa fa-check text-white text-xs"></i>
                            </div>
                        </div>
                        <div>
                            <h4 class="text-white font-semibold text-lg">合并相同物料编码</h4>
                            <p class="text-blue-300">自动识别并合并相同物料编码的行，智能累加数量</p>
                        </div>
                    </label>
                    
                    <label class="checkbox-custom flex items-center p-5 glass rounded-lg hover:bg-white/5 transition-all cursor-pointer">
                        <div class="relative mr-6">
                            <input type="checkbox" id="splitModel" class="sr-only" checked>
                            <div class="checkbox-icon w-6 h-6 rounded border-2 border-blue-400 flex items-center justify-center">
                                <i class="fa fa-check text-white text-xs"></i>
                            </div>
                        </div>
                        <div>
                            <h4 class="text-white font-semibold text-lg">分割型号列</h4>
                            <p class="text-blue-300">从型号列智能提取长、宽、高数值，自动创建对应列</p>
                        </div>
                    </label>
                    
                    <label class="checkbox-custom flex items-center p-5 glass rounded-lg hover:bg-white/5 transition-all cursor-pointer">
                        <div class="relative mr-6">
                            <input type="checkbox" id="calculateTotal" class="sr-only" checked>
                            <div class="checkbox-icon w-6 h-6 rounded border-2 border-blue-400 flex items-center justify-center">
                                <i class="fa fa-check text-white text-xs"></i>
                            </div>
                        </div>
                        <div>
                            <h4 class="text-white font-semibold text-lg">计算面积和总面积</h4>
                            <p class="text-blue-300">基于长、宽、高智能计算表面积，并乘以数量得到总面积</p>
                        </div>
                    </label>
                    
                    <label class="checkbox-custom flex items-center p-5 glass rounded-lg hover:bg-white/5 transition-all cursor-pointer">
                        <div class="relative mr-6">
                            <input type="checkbox" id="calculatePriceTotal" class="sr-only" checked>
                            <div class="checkbox-icon w-6 h-6 rounded border-2 border-blue-400 flex items-center justify-center">
                                <i class="fa fa-check text-white text-xs"></i>
                            </div>
                        </div>
                        <div>
                            <h4 class="text-white font-semibold text-lg">计算总价（新增）</h4>
                            <p class="text-blue-300">自动计算每一行的总价（单价 × 数量），并添加合计</p>
                        </div>
                    </label>
                    
                    <label class="checkbox-custom flex items-center p-5 glass rounded-lg hover:bg-white/5 transition-all cursor-pointer">
                        <div class="relative mr-6">
                            <input type="checkbox" id="formatCells" class="sr-only" checked>
                            <div class="checkbox-icon w-6 h-6 rounded border-2 border-blue-400 flex items-center justify-center">
                                <i class="fa fa-check text-white text-xs"></i>
                            </div>
                        </div>
                        <div>
                            <h4 class="text-white font-semibold text-lg">自动调整列宽和居中（新增）</h4>
                            <p class="text-blue-300">智能调整所有列宽以适应内容，并设置单元格居中对齐</p>
                        </div>
                    </label>
                </div>
                
                <div class="mt-10">
                    <button id="processBtn" class="btn-primary text-white px-10 py-4 rounded-xl font-semibold text-lg w-full">
                        <i class="fa fa-cogs mr-3"></i>开始智能处理
                    </button>
                </div>
            </div>

            <!-- Progress Section -->
            <div id="progressSection" class="glass-dark rounded-2xl p-10 mb-8 hidden border-glow animate-on-load card" style="animation-delay: 0.4s; animation-fill-mode: forwards;">
                <div class="flex items-center justify-between mb-8">
                    <h3 class="text-2xl font-bold text-white">处理进度</h3>
                    <div class="w-12 h-12 rounded-full glass flex items-center justify-center">
                        <i class="fa fa-tachometer text-blue-400 text-xl"></i>
                    </div>
                </div>
                
                <div class="w-full bg-white/10 rounded-full h-7 mb-6 overflow-hidden">
                    <div id="progressBar" class="progress-bar h-full rounded-full" style="width: 0%"></div>
                </div>
                
                <div class="flex items-center justify-between">
                    <p id="progressText" class="text-blue-300 text-lg">准备就绪</p>
                    <div id="loadingSpinner" class="loading-spinner w-8 h-8 rounded-full hidden"></div>
                </div>
            </div>

            <!-- Download Section -->
            <div id="downloadSection" class="glass-dark rounded-2xl p-10 mb-8 hidden border-glow animate-on-load card" style="animation-delay: 0.5s; animation-fill-mode: forwards;">
                <div class="flex items-center justify-between mb-8">
                    <h3 class="text-2xl font-bold text-white">处理完成</h3>
                    <div class="w-12 h-12 rounded-full glass flex items-center justify-center">
                        <i class="fa fa-check-circle text-green-400 text-xl"></i>
                    </div>
                </div>
                
                <div class="text-center py-8">
                    <div class="w-24 h-24 rounded-full glass flex items-center justify-center mx-auto mb-8 border-green-400/50 animate-pulse-slow">
                        <i class="fa fa-check text-5xl text-green-400"></i>
                    </div>
                    <h4 class="text-2xl font-semibold text-white mb-4">文件处理成功！</h4>
                    <p class="text-blue-300 mb-10 text-lg">所有数据转换和计算已完成，文件已准备就绪</p>
                    
                    <button id="downloadBtn" class="btn-primary text-white px-10 py-4 rounded-xl font-semibold text-lg">
                        <i class="fa fa-download mr-3"></i>立即下载
                    </button>
                </div>
            </div>

            <!-- Log Section -->
            <div class="glass-dark rounded-2xl p-10 border-glow animate-on-load card" style="animation-delay: 0.6s; animation-fill-mode: forwards;">
                <div class="flex items-center justify-between mb-8">
                    <h3 class="text-2xl font-bold text-white">处理日志</h3>
                    <div class="w-12 h-12 rounded-full glass flex items-center justify-center">
                        <i class="fa fa-list-alt text-blue-400 text-xl"></i>
                    </div>
                </div>
                
                <div id="logContainer" class="h-96 overflow-y-auto p-5 glass rounded-xl text-sm scrollbar-thin">
                    <div class="text-blue-300 text-center py-16">
                        <i class="fa fa-info-circle text-3xl mb-6 block"></i>
                        <p class="text-lg">等待处理任务...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer py-8 mt-16">
        <div class="container mx-auto px-4 text-center">
            <div class="flex flex-col md:flex-row items-center justify-center gap-4">
                <div class="flex items-center">
                    <i class="fa fa-copyright text-blue-400 mr-2"></i>
                    <span class="footer-text font-semibold text-lg">2026 智能化研究所</span>
                </div>
                <div class="text-gray-400">|</div>
                <div class="flex items-center">
                    <i class="fa fa-user text-blue-400 mr-2"></i>
                    <span class="footer-text font-semibold text-lg">创作者：小强</span>
                </div>
            </div>
            <div class="mt-4 text-gray-500 text-sm">
                <p>专业的Excel智能处理平台，让数据处理更简单、更高效</p>
            </div>
        </div>
    </footer>

    <script>
        // Initialize variables
        let uploadedFile = null;
        let processedWorkbook = null;
        
        // DOM elements
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const browseBtn = document.getElementById('browseBtn');
        const optionsSection = document.getElementById('optionsSection');
        const progressSection = document.getElementById('progressSection');
        const downloadSection = document.getElementById('downloadSection');
        const processBtn = document.getElementById('processBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const logContainer = document.getElementById('logContainer');
        const worksheetSelect = document.getElementById('worksheetSelect');
        
        // Checkbox elements
        const mergeItems = document.getElementById('mergeItems');
        const splitModel = document.getElementById('splitModel');
        const calculateTotal = document.getElementById('calculateTotal');
        const calculatePriceTotal = document.getElementById('calculatePriceTotal');
        const formatCells = document.getElementById('formatCells');
        
        // Initialize checkbox icons
        function updateCheckboxIcons() {
            const checkboxes = [mergeItems, splitModel, calculateTotal, calculatePriceTotal, formatCells];
            checkboxes.forEach(checkbox => {
                const icon = checkbox.nextElementSibling.querySelector('i');
                if (checkbox.checked) {
                    icon.style.opacity = '1';
                    icon.style.transform = 'scale(1)';
                } else {
                    icon.style.opacity = '0';
                    icon.style.transform = 'scale(0.5)';
                }
            });
        }
        
        // Add event listeners for checkbox changes
        mergeItems.addEventListener('change', updateCheckboxIcons);
        splitModel.addEventListener('change', updateCheckboxIcons);
        calculateTotal.addEventListener('change', updateCheckboxIcons);
        calculatePriceTotal.addEventListener('change', updateCheckboxIcons);
        formatCells.addEventListener('change', updateCheckboxIcons);
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            updateCheckboxIcons();
            
            // Animate elements on load
            gsap.utils.toArray('.animate-on-load').forEach((element, i) => {
                gsap.to(element, {
                    opacity: 1,
                    y: 0,
                    duration: 0.8,
                    ease: 'power3.out',
                    delay: i * 0.1
                });
            });
        });
        
        // File upload handlers
        browseBtn.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });
        
        // Handle file upload
        function handleFile(file) {
            // Validate file type
            if (!file.name.match(/\.(xlsx|xls)$/i)) {
                addLog('错误', '请上传Excel文件（.xlsx 或 .xls 格式）', 'danger');
                return;
            }
            
            // Validate file size (10MB limit)
            if (file.size > 10 * 1024 * 1024) {
                addLog('错误', '文件大小不能超过10MB', 'danger');
                return;
            }
            
            uploadedFile = file;
            addLog('成功', `文件 "${file.name}" 上传成功`, 'success');
            
            // Parse file to get worksheet names
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheetNames = workbook.SheetNames;
                    
                    // Clear previous options
                    worksheetSelect.innerHTML = '<option value="all">处理所有工作表</option>';
                    
                    // Add worksheet options
                    sheetNames.forEach((sheetName, index) => {
                        const option = document.createElement('option');
                        option.value = sheetName;
                        option.textContent = `${index + 1}. ${sheetName}`;
                        worksheetSelect.appendChild(option);
                    });
                    
                    addLog('信息', `检测到 ${sheetNames.length} 个工作表`, 'info');
                    
                    // Show options section
                    optionsSection.classList.remove('hidden');
                    
                    // Scroll to options section
                    optionsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                } catch (error) {
                    addLog('错误', `解析文件时出错: ${error.message}`, 'danger');
                }
            };
            
            reader.readAsArrayBuffer(file);
        }
        
        // Process button handler
        processBtn.addEventListener('click', () => {
            if (!uploadedFile) {
                addLog('错误', '请先上传文件', 'danger');
                return;
            }
            
            // Show progress section
            progressSection.classList.remove('hidden');
            downloadSection.classList.add('hidden');
            
            // Scroll to progress section
            progressSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            
            // Disable process button
            processBtn.disabled = true;
            processBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>处理中...';
            
            // Show loading spinner
            loadingSpinner.classList.remove('hidden');
            
            // Clear previous logs
            clearLogs();
            addLog('信息', '开始处理文件...', 'info');
            
            // Process file
            processFile();
        });
        
        // Process Excel file
        function processFile() {
            const reader = new FileReader();
            
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheetNames = workbook.SheetNames;
                    
                    addLog('信息', `检测到 ${sheetNames.length} 个工作表`, 'info');
                    
                    // Create a new workbook for processed data
                    processedWorkbook = XLSX.utils.book_new();
                    
                    // Get selected worksheet
                    const selectedWorksheet = worksheetSelect.value;
                    
                    // Process selected sheets
                    const sheetsToProcess = selectedWorksheet === 'all' ? sheetNames : [selectedWorksheet];
                    
                    sheetsToProcess.forEach((sheetName, sheetIndex) => {
                        addLog('信息', `处理工作表 "${sheetName}"...`, 'info');
                        
                        // Read sheet data
                        const worksheet = workbook.Sheets[sheetName];
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false });
                        
                        if (jsonData.length === 0) {
                            addLog('警告', `工作表 "${sheetName}" 为空，跳过处理`, 'warning');
                            return;
                        }
                        
                        // Find header row (first row containing '物料' or '编码')
                        let headerRowIndex = -1;
                        for (let i = 0; i < jsonData.length; i++) {
                            const row = jsonData[i];
                            if (row && Array.isArray(row)) {
                                for (let j = 0; j < row.length; j++) {
                                    const cell = row[j];
                                    if (typeof cell === 'string' && (cell.includes('物料') || cell.includes('编码'))) {
                                        headerRowIndex = i;
                                        break;
                                    }
                                }
                                if (headerRowIndex !== -1) break;
                            }
                        }
                        
                        if (headerRowIndex === -1) {
                            addLog('警告', `未找到包含物料编码的行，跳过处理工作表 "${sheetName}"`, 'warning');
                            updateProgress((sheetIndex + 1) / sheetsToProcess.length * 100);
                            return;
                        }
                        
                        addLog('信息', `找到表头行：第 ${headerRowIndex + 1} 行`, 'info');
                        
                        // Get headers
                        const headers = jsonData[headerRowIndex] || [];
                        
                        // Find data range
                        let dataStartRowIndex = -1;
                        let dataEndRowIndex = -1;
                        
                        // Find the first row with numeric data in the first column (assuming it's the index column)
                        for (let i = headerRowIndex + 1; i < jsonData.length; i++) {
                            const row = jsonData[i];
                            if (row && row.length > 0) {
                                const firstCell = row[0];
                                if (typeof firstCell === 'number' || (typeof firstCell === 'string' && !isNaN(parseFloat(firstCell)))) {
                                    dataStartRowIndex = i;
                                    break;
                                }
                            }
                        }
                        
                        // Find the last row with numeric data in the first column
                        for (let i = jsonData.length - 1; i > headerRowIndex; i--) {
                            const row = jsonData[i];
                            if (row && row.length > 0) {
                                const firstCell = row[0];
                                if (typeof firstCell === 'number' || (typeof firstCell === 'string' && !isNaN(parseFloat(firstCell)))) {
                                    dataEndRowIndex = i;
                                    break;
                                }
                            }
                        }
                        
                        if (dataStartRowIndex === -1 || dataEndRowIndex === -1) {
                            addLog('警告', `未找到有效的数据行范围，使用默认范围`, 'warning');
                            dataStartRowIndex = headerRowIndex + 1;
                            dataEndRowIndex = jsonData.length - 1;
                        } else {
                            addLog('信息', `找到数据范围：第 ${dataStartRowIndex + 1} 行 到 第 ${dataEndRowIndex + 1} 行`, 'info');
                        }
                        
                        // Step 1: Merge items with same material code if enabled
                        if (mergeItems.checked) {
                            // Find required columns for merging
                            const materialCodeColumnIndex = headers.findIndex(h => typeof h === 'string' && (h.includes('物料') || h.includes('编码')));
                            const quantityColumnIndex = headers.findIndex(h => typeof h === 'string' && h.includes('数量'));
                            
                            if (materialCodeColumnIndex !== -1 && quantityColumnIndex !== -1) {
                                addLog('信息', '步骤1: 合并相同物料编码并累加数量...', 'info');
                                
                                // Start with all rows before header row and the header row itself
                                const mergedData = [];
                                for (let i = 0; i <= headerRowIndex; i++) {
                                    const row = jsonData[i];
                                    if (row && Array.isArray(row)) {
                                        mergedData.push([...row]);
                                    } else {
                                        mergedData.push([]);
                                    }
                                }
                                
                                const materialMap = new Map();
                                
                                // Process each row within data range
                                for (let i = dataStartRowIndex; i <= dataEndRowIndex; i++) {
                                    const row = jsonData[i];
                                    if (!row) continue; // Skip undefined rows
                                    
                                    const materialCode = row[materialCodeColumnIndex] || '';
                                    
                                    if (materialCode) {
                                        if (materialMap.has(materialCode)) {
                                            // Existing material code, update quantity
                                            const existingRow = materialMap.get(materialCode);
                                            if (existingRow && quantityColumnIndex !== -1 && quantityColumnIndex < existingRow.length && quantityColumnIndex < row.length) {
                                                const existingQuantity = parseFloat(existingRow[quantityColumnIndex]) || 0;
                                                const newQuantity = parseFloat(row[quantityColumnIndex]) || 0;
                                                existingRow[quantityColumnIndex] = existingQuantity + newQuantity;
                                            }
                                        } else {
                                            // New material code, add to map
                                            if (row && Array.isArray(row)) {
                                                materialMap.set(materialCode, [...row]);
                                            }
                                        }
                                    } else {
                                        // Row without material code, add directly
                                        if (row && Array.isArray(row)) {
                                            mergedData.push([...row]);
                                        }
                                    }
                                }
                                
                                // Convert map values to array
                                materialMap.forEach(row => {
                                    mergedData.push(row);
                                });
                                
                                // Replace original data with merged data
                                jsonData.length = 0;
                                mergedData.forEach(row => jsonData.push(row));
                                
                                // Update data range indices after merging
                                dataStartRowIndex = headerRowIndex + 1;
                                dataEndRowIndex = jsonData.length - 1;
                                
                                addLog('成功', `合并完成，共处理 ${materialMap.size} 个唯一物料编码`, 'success');
                            } else {
                                addLog('警告', '未找到物料编码列或数量列，跳过合并步骤', 'warning');
                            }
                        }
                        
                        updateProgress((sheetIndex + 0.15) / sheetsToProcess.length * 100);
                        
                        // Step 2: Split model column if enabled
                        if (splitModel.checked) {
                            // Find model column
                            const modelColumnIndex = headers.findIndex(h => typeof h === 'string' && h.includes('型号'));
                            
                            // Check if dimensions columns already exist
                            const hasLengthColumn = headers.some(h => typeof h === 'string' && h.includes('长'));
                            const hasWidthColumn = headers.some(h => typeof h === 'string' && h.includes('宽'));
                            const hasHeightColumn = headers.some(h => typeof h === 'string' && h.includes('高'));
                            
                            if (modelColumnIndex !== -1 && !(hasLengthColumn && hasWidthColumn && hasHeightColumn)) {
                                addLog('信息', '步骤2: 分割型号列为长、宽、高...', 'info');
                                
                                // First, update the header row
                                const headerRow = jsonData[headerRowIndex];
                                if (headerRow && Array.isArray(headerRow)) {
                                    headerRow.splice(modelColumnIndex + 1, 0, '长（mm）', '宽（mm）', '高（mm）');
                                    addLog('调试', '已更新表头行，添加长、宽、高列', 'info');
                                }
                                
                                // Update headers array
                                headers.splice(modelColumnIndex + 1, 0, '长（mm）', '宽（mm）', '高（mm）');
                                
                                // Process each data row
                                for (let i = dataStartRowIndex; i <= dataEndRowIndex; i++) {
                                    const row = jsonData[i];
                                    if (!row || !Array.isArray(row)) continue;
                                    
                                    const modelValue = row[modelColumnIndex] || '';
                                    
                                    if (typeof modelValue === 'string') {
                                        // Extract numbers using regex
                                        const dimensions = modelValue.match(/(\d+(\.\d+)?)/g);
                                        
                                        if (dimensions && dimensions.length >= 3) {
                                            // Insert length, width, height after model column
                                            const length = parseFloat(dimensions[0]) || 0;
                                            const width = parseFloat(dimensions[1]) || 0;
                                            const height = parseFloat(dimensions[2]) || 0;
                                            
                                            row.splice(modelColumnIndex + 1, 0, length, width, height);
                                            addLog('调试', `行 ${i+1}: 成功提取尺寸 ${length}×${width}×${height}`, 'info');
                                        } else {
                                            // Insert empty values if no dimensions found
                                            row.splice(modelColumnIndex + 1, 0, '', '', '');
                                            addLog('警告', `行 ${i+1}: 无法从型号 "${modelValue}" 中提取尺寸信息`, 'warning');
                                        }
                                    } else {
                                        // Insert empty values for non-string model values
                                        row.splice(modelColumnIndex + 1, 0, '', '', '');
                                    }
                                }
                            
                                addLog('信息', '已插入表头：长（mm）、宽（mm）、高（mm）', 'info');
                            } else if (hasLengthColumn && hasWidthColumn && hasHeightColumn) {
                                addLog('信息', '长、宽、高列已存在，跳过分割步骤', 'info');
                            } else {
                                addLog('警告', '未找到型号列，跳过分割步骤', 'warning');
                            }
                        }
                        
                        updateProgress((sheetIndex + 0.3) / sheetsToProcess.length * 100);
                        
                        // Step 3: Calculate total column if enabled
                        if (calculateTotal.checked) {
                            addLog('信息', '步骤3: 计算面积和总面积...', 'info');
                            
                            // Find dimensions columns
                            let lengthIndex = -1;
                            let widthIndex = -1;
                            let heightIndex = -1;
                            
                            headers.forEach((header, index) => {
                                if (typeof header === 'string') {
                                    if (header.includes('长')) lengthIndex = index;
                                    if (header.includes('宽')) widthIndex = index;
                                    if (header.includes('高')) heightIndex = index;
                                }
                            });
                            
                            // Check if area columns already exist
                            const hasAreaColumn = headers.some(h => typeof h === 'string' && h.includes('面积'));
                            const hasTotalAreaColumn = headers.some(h => typeof h === 'string' && h.includes('总面积'));
                            
                            // Find note column index
                            const noteColumnIndex = headers.findIndex(h => typeof h === 'string' && h.includes('备注'));
                            addLog('调试', `找到备注列索引: ${noteColumnIndex}`, 'info');
                            
                            if (lengthIndex !== -1 && widthIndex !== -1 && heightIndex !== -1 && noteColumnIndex !== -1) {
                                addLog('调试', `找到尺寸列 - 长:${lengthIndex}, 宽:${widthIndex}, 高:${heightIndex}`, 'info');
                                
                                // Find quantity column
                                const quantityColumnIndex = headers.findIndex(h => typeof h === 'string' && h.includes('数量'));
                                addLog('调试', `找到数量列索引: ${quantityColumnIndex}`, 'info');
                                
                                if (quantityColumnIndex !== -1) {
                                    if (!(hasAreaColumn && hasTotalAreaColumn)) {
                                        // First, update the header row
                                        const headerRow = jsonData[headerRowIndex];
                                        if (headerRow && Array.isArray(headerRow)) {
                                            headerRow.splice(noteColumnIndex + 1, 0, '面积㎡', '总面积㎡');
                                            addLog('调试', '已更新表头行，添加面积和总面积列', 'info');
                                        }
                                        
                                        // Update headers array
                                        headers.splice(noteColumnIndex + 1, 0, '面积㎡', '总面积㎡');
                                        
                                        // Find the new column indices
                                        const areaColumnIndex = noteColumnIndex + 1;
                                        const totalAreaColumnIndex = noteColumnIndex + 2;
                                        
                                        // Process all data rows
                                        for (let i = dataStartRowIndex; i <= dataEndRowIndex; i++) {
                                            const row = jsonData[i];
                                            if (!row || !Array.isArray(row)) continue;
                                            
                                            // Calculate surface area
                                            const length = parseFloat(row[lengthIndex] || 0) || 0;
                                            const width = parseFloat(row[widthIndex] || 0) || 0;
                                            const height = parseFloat(row[heightIndex] || 0) || 0;
                                            
                                            let surfaceAreaM2 = '';
                                            // Only calculate if all dimensions are valid and non-zero
                                            if (!isNaN(length) && !isNaN(width) && !isNaN(height) && length > 0 && width > 0 && height > 0) {
                                                const surfaceArea = 2 * (length * width + length * height + width * height);
                                                surfaceAreaM2 = (surfaceArea / 1000000).toFixed(2);
                                            }
                                            
                                            // Calculate total area * quantity
                                            let totalAreaQuantity = '';
                                            if (surfaceAreaM2 && quantityColumnIndex !== -1 && quantityColumnIndex < row.length) {
                                                const quantity = parseFloat(row[quantityColumnIndex] || 0) || 0;
                                                // Only calculate if both area and quantity are valid and non-zero
                                                if (!isNaN(quantity) && quantity > 0) {
                                                    totalAreaQuantity = (parseFloat(surfaceAreaM2) * quantity).toFixed(2);
                                                }
                                            }
                                            
                                            // Insert area and total area values after note column
                                            row.splice(noteColumnIndex + 1, 0, surfaceAreaM2, totalAreaQuantity);
                                            
                                            addLog('调试', `行 ${i+1}: 计算面积 ${surfaceAreaM2}, 总面积 ${totalAreaQuantity}`, 'info');
                                        }
                                        
                                        addLog('信息', '已在备注列后插入表头：面积㎡、总面积㎡', 'info');
                                    } else {
                                        // Use existing area columns
                                        const areaColumnIndex = headers.findIndex(h => typeof h === 'string' && h.includes('面积'));
                                        const totalAreaColumnIndex = headers.findIndex(h => typeof h === 'string' && h.includes('总面积'));
                                        
                                        addLog('调试', `使用已有的面积列索引: ${areaColumnIndex}, 总面积列索引: ${totalAreaColumnIndex}`, 'info');
                                        
                                        // Process all data rows
                                        for (let i = dataStartRowIndex; i <= dataEndRowIndex; i++) {
                                            const row = jsonData[i];
                                            if (!row || !Array.isArray(row)) continue;
                                            
                                            // Calculate surface area
                                            const length = parseFloat(row[lengthIndex] || 0) || 0;
                                            const width = parseFloat(row[widthIndex] || 0) || 0;
                                            const height = parseFloat(row[heightIndex] || 0) || 0;
                                            
                                            let surfaceAreaM2 = '';
                                            // Only calculate if all dimensions are valid and non-zero
                                            if (!isNaN(length) && !isNaN(width) && !isNaN(height) && length > 0 && width > 0 && height > 0) {
                                                const surfaceArea = 2 * (length * width + length * height + width * height);
                                                surfaceAreaM2 = (surfaceArea / 1000000).toFixed(2);
                                            }
                                            
                                            // Calculate total area * quantity
                                            let totalAreaQuantity = '';
                                            if (surfaceAreaM2 && quantityColumnIndex !== -1 && quantityColumnIndex < row.length) {
                                                const quantity = parseFloat(row[quantityColumnIndex] || 0) || 0;
                                                // Only calculate if both area and quantity are valid and non-zero
                                                if (!isNaN(quantity) && quantity > 0) {
                                                    totalAreaQuantity = (parseFloat(surfaceAreaM2) * quantity).toFixed(2);
                                                }
                                            }
                                            
                                            // Update existing area columns
                                            if (areaColumnIndex !== -1) {
                                                if (areaColumnIndex < row.length) {
                                                    row[areaColumnIndex] = surfaceAreaM2;
                                                } else {
                                                    // If column doesn't exist in this row, add it
                                                    while (row.length <= areaColumnIndex) {
                                                        row.push('');
                                                    }
                                                    row[areaColumnIndex] = surfaceAreaM2;
                                                }
                                            }
                                            
                                            if (totalAreaColumnIndex !== -1) {
                                                if (totalAreaColumnIndex < row.length) {
                                                    row[totalAreaColumnIndex] = totalAreaQuantity;
                                                } else {
                                                    // If column doesn't exist in this row, add it
                                                    while (row.length <= totalAreaColumnIndex) {
                                                        row.push('');
                                                    }
                                                    row[totalAreaColumnIndex] = totalAreaQuantity;
                                                }
                                            }
                                            
                                            addLog('调试', `行 ${i+1}: 更新面积 ${surfaceAreaM2}, 总面积 ${totalAreaQuantity}`, 'info');
                                        }
                                        
                                        addLog('信息', '已更新现有的面积和总面积列', 'info');
                                    }
                                } else {
                                    addLog('警告', '未找到数量列，无法计算总面积', 'warning');
                                }
                            } else {
                                if (noteColumnIndex === -1) {
                                    addLog('警告', '未找到备注列，无法插入面积和总面积列', 'warning');
                                } else {
                                    addLog('警告', '未找到长、宽、高列，无法计算面积值', 'warning');
                                }
                            }
                        }
                        
                        updateProgress((sheetIndex + 0.45) / sheetsToProcess.length * 100);
                        
                        // Step 4: Calculate price total if enabled (新增功能)
                        if (calculatePriceTotal.checked) {
                            addLog('信息', '步骤4: 计算每一行的总价（单价 × 数量）...', 'info');
                            
                            // Find price and quantity columns
                            const priceColumnIndex = headers.findIndex(h => typeof h === 'string' && h.includes('单价'));
                            const quantityColumnIndex = headers.findIndex(h => typeof h === 'string' && h.includes('数量'));
                            // Find existing total price column
                            const totalPriceColumnIndex = headers.findIndex(h => typeof h === 'string' && (h.includes('总价') || h.includes('金额')));
                            
                            addLog('调试', `找到单价列索引: ${priceColumnIndex}, 数量列索引: ${quantityColumnIndex}, 总价列索引: ${totalPriceColumnIndex}`, 'info');
                            
                            if (priceColumnIndex !== -1 && quantityColumnIndex !== -1) {
                                if (totalPriceColumnIndex !== -1) {
                                    // Use existing total price column
                                    addLog('调试', '找到已有的总价列，将直接填充数据', 'info');
                                    
                                    // Process all data rows
                                    for (let i = dataStartRowIndex; i <= dataEndRowIndex; i++) {
                                        const row = jsonData[i];
                                        if (!row || !Array.isArray(row)) continue;
                                        
                                        // Get price and quantity values
                                        const price = parseFloat(row[priceColumnIndex] || 0) || 0;
                                        const quantity = parseFloat(row[quantityColumnIndex] || 0) || 0;
                                        
                                        // Calculate total price
                                        let totalPrice = '';
                                        if (!isNaN(price) && !isNaN(quantity) && price > 0 && quantity > 0) {
                                            totalPrice = (price * quantity).toFixed(2);
                                        }
                                        
                                        // Fill total price in existing column
                                        if (totalPriceColumnIndex < row.length) {
                                            row[totalPriceColumnIndex] = totalPrice;
                                        } else {
                                            // If column doesn't exist in this row, add it
                                            while (row.length <= totalPriceColumnIndex) {
                                                row.push('');
                                            }
                                            row[totalPriceColumnIndex] = totalPrice;
                                        }
                                        
                                        addLog('调试', `行 ${i+1}: 计算总价 ${totalPrice}（单价: ${price} × 数量: ${quantity}）`, 'info');
                                    }
                                    
                                    addLog('成功', '已在现有总价列中填充数据', 'success');
                                } else {
                                    addLog('警告', '未找到总价列，将创建新列', 'warning');
                                    // Find the position to insert total price column (after price column)
                                    const insertPosition = priceColumnIndex + 1;
                                    
                                    // Update header row
                                    const headerRow = jsonData[headerRowIndex];
                                    if (headerRow && Array.isArray(headerRow)) {
                                        headerRow.splice(insertPosition, 0, '总价');
                                        addLog('调试', '已更新表头行，添加总价列', 'info');
                                    }
                                    
                                    // Update headers array
                                    headers.splice(insertPosition, 0, '总价');
                                    
                                    // Process all data rows
                                    for (let i = dataStartRowIndex; i <= dataEndRowIndex; i++) {
                                        const row = jsonData[i];
                                        if (!row || !Array.isArray(row)) continue;
                                        
                                        // Get price and quantity values
                                        const price = parseFloat(row[priceColumnIndex] || 0) || 0;
                                        const quantity = parseFloat(row[quantityColumnIndex] || 0) || 0;
                                        
                                        // Calculate total price
                                        let totalPrice = '';
                                        if (!isNaN(price) && !isNaN(quantity) && price > 0 && quantity > 0) {
                                            totalPrice = (price * quantity).toFixed(2);
                                        }
                                        
                                        // Insert total price after price column
                                        row.splice(insertPosition, 0, totalPrice);
                                        
                                        addLog('调试', `行 ${i+1}: 计算总价 ${totalPrice}（单价: ${price} × 数量: ${quantity}）`, 'info');
                                    }
                                    
                                    addLog('成功', '已在单价列后插入表头：总价', 'success');
                                }
                            } else {
                                addLog('警告', '未找到单价列或数量列，无法计算总价', 'warning');
                            }
                        }
                        
                        updateProgress((sheetIndex + 0.6) / sheetsToProcess.length * 100);
                        
                        // Step 5: Add total row at the end of the entire process
                        if (dataStartRowIndex <= dataEndRowIndex && dataEndRowIndex < jsonData.length) {
                            addLog('信息', '步骤5: 在最终数据中添加合计行...', 'info');
                            
                            // Get all data rows (excluding header and any existing total rows)
                            const dataRows = [];
                            for (let i = dataStartRowIndex; i <= dataEndRowIndex; i++) {
                                const row = jsonData[i];
                                if (row && Array.isArray(row) && row.length > 0 && row[0] !== '合计') {
                                    dataRows.push(row);
                                }
                            }
                            
                            if (dataRows.length > 0) {
                                // Create total row
                                const totalRow = [];
                                
                                // Initialize total row with empty values
                                const maxColumns = Math.max(...dataRows.map(row => row.length));
                                for (let col = 0; col < maxColumns; col++) {
                                    totalRow.push('');
                                }
                                
                                // Set first column to "合计"
                                totalRow[0] = '合计';
                                
                                // Calculate sums for numeric columns
                                for (let col = 1; col < maxColumns; col++) {
                                    let columnSum = 0;
                                    let isNumericColumn = true;
                                    
                                    // Check if column contains only numbers
                                    for (let rowIndex = 0; rowIndex < dataRows.length; rowIndex++) {
                                        const row = dataRows[rowIndex];
                                        if (!row || col >= row.length) continue;
                                        
                                        const cellValue = row[col];
                                        if (cellValue === '' || cellValue === null || cellValue === undefined) {
                                            continue; // Skip empty cells
                                        }
                                        
                                        const numValue = parseFloat(cellValue);
                                        if (isNaN(numValue)) {
                                            isNumericColumn = false;
                                            break;
                                        }
                                    }
                                    
                                    // If column is numeric, calculate sum
                                    if (isNumericColumn) {
                                        for (let rowIndex = 0; rowIndex < dataRows.length; rowIndex++) {
                                            const row = dataRows[rowIndex];
                                            if (!row || col >= row.length) continue;
                                            
                                            const cellValue = row[col];
                                            const numValue = parseFloat(cellValue);
                                            if (!isNaN(numValue)) {
                                                columnSum += numValue;
                                            }
                                        }
                                        
                                        // Round to 2 decimal places for decimal numbers
                                        if (columnSum % 1 !== 0) {
                                            totalRow[col] = columnSum.toFixed(2);
                                        } else {
                                            totalRow[col] = Math.round(columnSum);
                                        }
                                        
                                        addLog('调试', `列 ${col} 合计: ${totalRow[col]}`, 'info');
                                    }
                                }
                                
                                // Add total row at the end of all data
                                jsonData.push(totalRow);
                                addLog('成功', '已在最终数据末尾添加合计行', 'success');
                                
                                // Renumber the rows if there's an index column
                                const indexColumnIndex = 0; // Assuming first column is index
                                for (let i = dataStartRowIndex; i < jsonData.length - 1; i++) {
                                    const row = jsonData[i];
                                    if (row && Array.isArray(row) && row.length > indexColumnIndex) {
                                        row[indexColumnIndex] = i - dataStartRowIndex + 1;
                                    }
                                }
                                addLog('成功', '已重新编号所有数据行', 'success');
                            } else {
                                addLog('警告', '没有找到有效的数据行，跳过合计行添加', 'warning');
                            }
                        }
                        
                        updateProgress((sheetIndex + 0.75) / sheetsToProcess.length * 100);
                        
                        // Step 6: Convert JSON back to worksheet
                        addLog('信息', '步骤6: 生成处理后的工作表...', 'info');
                        const newWorksheet = XLSX.utils.aoa_to_sheet(jsonData);
                        
                        // Step 7: Apply formatting if enabled (新增功能)
                        if (formatCells.checked) {
                            addLog('信息', '步骤7: 自动调整列宽和设置居中对齐...', 'info');
                            
                            // Auto-fit column widths based on content
                            const range = XLSX.utils.decode_range(newWorksheet['!ref']);
                            
                            // Calculate max width for each column
                            const columnWidths = [];
                            
                            // First, check if headers exist
                            if (headers && headers.length > 0) {
                                headers.forEach((header, colIndex) => {
                                    if (header && typeof header === 'string') {
                                        const width = Math.max(header.length * 1.2, 10); // Minimum width of 10
                                        columnWidths[colIndex] = width;
                                    }
                                });
                            }
                            
                            // Then check data rows
                            for (let rowIndex = dataStartRowIndex; rowIndex <= dataEndRowIndex; rowIndex++) {
                                const row = jsonData[rowIndex];
                                if (!row || !Array.isArray(row)) continue;
                                
                                row.forEach((cell, colIndex) => {
                                    if (cell !== null && cell !== undefined) {
                                        const cellStr = cell.toString();
                                        const width = Math.max(cellStr.length * 1.1, columnWidths[colIndex] || 10);
                                        columnWidths[colIndex] = width;
                                    }
                                });
                            }
                            
                            // Set column widths
                            if (columnWidths.length > 0) {
                                newWorksheet['!cols'] = columnWidths.map(width => ({ wch: Math.ceil(width) }));
                                addLog('调试', `设置列宽: [${columnWidths.map(w => Math.ceil(w)).join(', ')}]`, 'info');
                            }
                            
                            // Apply center alignment to all cells
                            // Create a range that covers all data
                            const allRange = {
                                s: { c: 0, r: 0 },
                                e: { c: range.e.c, r: range.e.r }
                            };
                            
                            // Apply center alignment to all cells
                            for (let R = allRange.s.r; R <= allRange.e.r; ++R) {
                                for (let C = allRange.s.c; C <= allRange.e.c; ++C) {
                                    const cellAddress = XLSX.utils.encode_cell({ c: C, r: R });
                                    
                                    // Ensure cell exists
                                    if (!newWorksheet[cellAddress]) {
                                        newWorksheet[cellAddress] = { v: '' };
                                    }
                                    
                                    // Apply center alignment
                                    if (!newWorksheet[cellAddress].s) {
                                        newWorksheet[cellAddress].s = {};
                                    }
                                    
                                    newWorksheet[cellAddress].s.alignment = {
                                        horizontal: 'center',
                                        vertical: 'center'
                                    };
                                }
                            }
                            
                            addLog('成功', '已应用居中对齐格式到所有单元格', 'success');
                        }
                        
                        // Add worksheet to workbook
                        processedWorkbook.Sheets[sheetName] = newWorksheet;
                        XLSX.utils.book_append_sheet(processedWorkbook, newWorksheet, sheetName);
                        
                        addLog('调试', `工作表 "${sheetName}" 处理完成，总行数: ${jsonData.length}`, 'info');
                        addLog('调试', `工作表 "${sheetName}" 已添加到工作簿`, 'info');
                        addLog('成功', `工作表 "${sheetName}" 处理完成`, 'success');
                        
                        updateProgress((sheetIndex + 1) / sheetsToProcess.length * 100);
                    });
                    
                    // Enable download button
                    processBtn.disabled = false;
                    processBtn.innerHTML = '<i class="fa fa-cogs mr-2"></i>开始处理';
                    
                    // Verify workbook contains sheets
                    const processedSheetNames = Object.keys(processedWorkbook.Sheets);
                    addLog('调试', `处理后的工作簿包含 ${processedSheetNames.length} 个工作表: ${processedSheetNames.join(', ')}`, 'info');
                    
                    if (processedSheetNames.length === 0) {
                        addLog('错误', '处理后的工作簿为空，可能是所有工作表处理失败', 'danger');
                        loadingSpinner.classList.add('hidden');
                        return;
                    }
                    
                    downloadSection.classList.remove('hidden');
                    
                    // Hide loading spinner
                    loadingSpinner.classList.add('hidden');
                    
                    // Scroll to download section
                    downloadSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    
                    addLog('成功', '文件处理完成！点击下方按钮下载处理后的文件', 'success');
                } catch (error) {
                    addLog('错误', `处理文件时出错: ${error.message}`, 'danger');
                    processBtn.disabled = false;
                    processBtn.innerHTML = '<i class="fa fa-cogs mr-2"></i>开始处理';
                    loadingSpinner.classList.add('hidden');
                }
            };
            
            reader.onerror = function() {
                addLog('错误', '读取文件时出错', 'danger');
                processBtn.disabled = false;
                processBtn.innerHTML = '<i class="fa fa-cogs mr-2"></i>开始处理';
                loadingSpinner.classList.add('hidden');
            };
            
            reader.readAsArrayBuffer(uploadedFile);
        }
        
        // Download button handler
        downloadBtn.addEventListener('click', () => {
            if (!processedWorkbook) {
                addLog('错误', '没有可下载的处理后文件', 'danger');
                return;
            }
            
            try {
                // Verify workbook structure
                const sheetNames = processedWorkbook.SheetNames || [];
                const sheets = processedWorkbook.Sheets || {};
                addLog('调试', `准备下载 - 工作簿包含 ${sheetNames.length} 个工作表，Sheets对象包含 ${Object.keys(sheets).length} 个工作表`, 'info');
                
                if (sheetNames.length === 0) {
                    addLog('错误', '工作簿中没有工作表，请重新处理文件', 'danger');
                    return;
                }
                
                // Generate a new filename with current date
                const originalName = uploadedFile ? uploadedFile.name : 'processed';
                const extension = originalName.match(/\.(xlsx|xls)$/) ? originalName.match(/\.(xlsx|xls)$/)[0] : '.xlsx';
                const baseName = originalName.replace(/\.(xlsx|xls)$/, '');
                
                // Get current date in YYYY-MM-DD format
                const today = new Date();
                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const day = String(today.getDate()).padStart(2, '0');
                const dateStr = `${year}${month}${day}`;
                
                const newFileName = `${baseName}_${dateStr}${extension}`;
                
                addLog('调试', `准备生成文件: ${newFileName}`, 'info');
                
                // Convert workbook to blob
                const wbout = XLSX.write(processedWorkbook, { bookType: 'xlsx', type: 'array' });
                const blob = new Blob([wbout], { type: 'application/octet-stream' });
                
                addLog('调试', `文件生成成功，大小: ${(blob.size / 1024).toFixed(2)} KB`, 'info');
                
                // Create download link
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = newFileName;
                document.body.appendChild(a);
                a.click();
                
                // Cleanup
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);
                
                addLog('成功', `文件 "${newFileName}" 下载成功`, 'success');
            } catch (error) {
                addLog('错误', `下载文件时出错: ${error.message}`, 'danger');
                addLog('调试', `错误详情: ${error.stack}`, 'danger');
            }
        });
        
        // Update progress bar
        function updateProgress(percent) {
            progressBar.style.width = `${percent}%`;
            progressText.textContent = `处理进度: ${Math.round(percent)}%`;
        }
        
        // Add log entry
        function addLog(type, message, level) {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry mb-3 p-3 rounded-lg ${getLevelClass(level)}`;
            
            logEntry.innerHTML = `
                <div class="flex items-start">
                    <div class="mr-3 mt-1">
                        <i class="fa ${getLevelIcon(level)}"></i>
                    </div>
                    <div class="flex-1">
                        <div class="flex items-center justify-between mb-1">
                            <span class="font-semibold">${type}</span>
                            <span class="text-xs text-gray-400">${timestamp}</span>
                        </div>
                        <p>${message}</p>
                    </div>
                </div>
            `;
            
            // Clear placeholder if present
            if (logContainer.querySelector('.text-center')) {
                logContainer.innerHTML = '';
            }
            
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        
        // Clear logs
        function clearLogs() {
            logContainer.innerHTML = '';
        }
        
        // Get level class
        function getLevelClass(level) {
            switch (level) {
                case 'success':
                    return 'bg-green-900/30 border border-green-500/30 text-green-300';
                case 'warning':
                    return 'bg-yellow-900/30 border border-yellow-500/30 text-yellow-300';
                case 'danger':
                    return 'bg-red-900/30 border border-red-500/30 text-red-300';
                case 'info':
                default:
                    return 'bg-blue-900/30 border border-blue-500/30 text-blue-300';
            }
        }
        
        // Get level icon
        function getLevelIcon(level) {
            switch (level) {
                case 'success':
                    return 'fa-check-circle text-green-400';
                case 'warning':
                    return 'fa-exclamation-triangle text-yellow-400';
                case 'danger':
                    return 'fa-times-circle text-red-400';
                case 'info':
                default:
                    return 'fa-info-circle text-blue-400';
            }
        }
    </script>
</body>
